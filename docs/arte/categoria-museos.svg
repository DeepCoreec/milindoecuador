<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" role="img" aria-label="Museos y cultura"><style>
.tinta{fill:var(--on-color)} .trazo{stroke:var(--on-color);fill:none;stroke-linecap:round;stroke-linejoin:round}
.cal{fill:var(--papel-alto)} .cal-trazo{stroke:var(--papel-alto);fill:none;stroke-linecap:round;stroke-linejoin:round}
.mango{fill:var(--mango)} .faro{fill:var(--faro)} .celeste{fill:var(--celeste)} .manglar{fill:var(--manglar)}
.buganvilla{fill:var(--buganvilla)} .celeste-tinta{fill:var(--celeste-tinta)} .ventana{fill:var(--mango)} .grano{opacity:.18;mix-blend-mode:multiply}
[data-theme="dark"] .cal{fill:var(--rio)} [data-theme="dark"] .cal-trazo{stroke:var(--rio)}
[data-theme="dark"] .grano{mix-blend-mode:screen;opacity:.08}
</style><defs><filter id="g-mus" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 -.55"/></filter><clipPath id="c-mus"><rect width="112" height="112" rx="12"/></clipPath></defs><g clip-path="url(#c-mus)"><rect class="faro" width="112" height="112"/><rect class="tinta" x="62" y="14" width="38" height="30" rx="2"/><rect class="celeste" x="66" y="18" width="30" height="22"/><circle class="mango" cx="88" cy="25" r="4"/><path class="manglar" d="M66,40 l10,-10 l8,6 l6,-4 l6,8 z"/><path class="trazo" stroke-width="1.5" d="M81,14 l0,-6"/><path class="cal" d="M14,42 h38 v20 a19,22 0 0 1 -38,0 z"/><path class="tinta" d="M21,52 q5,-5 10,0 q-5,3 -10,0 z M35,52 q5,-5 10,0 q-5,3 -10,0 z"/><path class="tinta" d="M22,66 q11,12 22,0 q-11,5 -22,0 z"/><path class="tinta" d="M44,62 h38 v18 a19,22 0 0 1 -38,0 z"/><path class="cal" d="M51,72 q5,4 10,0 q-5,-3 -10,0 z M65,72 q5,4 10,0 q-5,-3 -10,0 z"/><path class="cal" d="M53,94 q10,-10 20,0 q-10,-5 -20,0 z"/><path class="cal-trazo" stroke-width="2" d="M44,64 q-8,6 -10,16 M82,64 q8,4 12,14"/><rect class="grano" width="112" height="112" filter="url(#g-mus)"/></g></svg>