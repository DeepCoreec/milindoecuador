<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" role="img" aria-label="Todas las categorías"><style>
.tinta{fill:var(--on-color)} .trazo{stroke:var(--on-color);fill:none;stroke-linecap:round;stroke-linejoin:round}
.cal{fill:var(--papel-alto)} .cal-trazo{stroke:var(--papel-alto);fill:none;stroke-linecap:round;stroke-linejoin:round}
.mango{fill:var(--mango)} .faro{fill:var(--faro)} .celeste{fill:var(--celeste)} .manglar{fill:var(--manglar)}
.buganvilla{fill:var(--buganvilla)} .celeste-tinta{fill:var(--celeste-tinta)} .ventana{fill:var(--mango)} .grano{opacity:.18;mix-blend-mode:multiply}
[data-theme="dark"] .cal{fill:var(--rio)} [data-theme="dark"] .cal-trazo{stroke:var(--rio)}
[data-theme="dark"] .grano{mix-blend-mode:screen;opacity:.08}
</style><defs><filter id="g-tod" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 -.55"/></filter><clipPath id="c-tod"><rect width="112" height="112" rx="12"/></clipPath></defs><g clip-path="url(#c-tod)"><rect class="cal" width="112" height="112"/><rect class="mango" x="20" y="20" width="20" height="20" rx="4"/><rect class="celeste" x="46" y="20" width="20" height="20" rx="4"/><rect class="faro" x="72" y="20" width="20" height="20" rx="4"/><rect class="manglar" x="20" y="46" width="20" height="20" rx="4"/><rect class="buganvilla" x="46" y="46" width="20" height="20" rx="4"/><rect class="celeste-tinta" x="72" y="46" width="20" height="20" rx="4"/><rect class="tinta" x="20" y="72" width="20" height="20" rx="4"/><rect class="mango" x="46" y="72" width="20" height="20" rx="4"/><rect class="faro" x="72" y="72" width="20" height="20" rx="4"/><rect class="grano" width="112" height="112" filter="url(#g-tod)"/></g></svg>