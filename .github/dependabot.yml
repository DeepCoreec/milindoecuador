# Dependabot revisa cada semana si alguna librería tiene una actualización de seguridad
# y abre un pull request con el cambio. Se revisa y se acepta a mano.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Guayaquil"
    open-pull-requests-limit: 5
    groups:
      dependencias-de-desarrollo:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    # Saltos de versión grande que hoy rompen algo (probados el 2026-10-05). Se revisan a mano cada pocos meses:
    # - eslint 10: eslint-plugin-react (dentro de eslint-config-next) todavía no funciona con él
    # - typescript 7: typescript-eslint todavía no lo soporta (la revisión de estilo deja de funcionar)
    # - @types/node: debe coincidir con la versión de Node que corre la página (22), no con la última
    # Las actualizaciones de seguridad siguen llegando aunque estén en esta lista.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Las acciones de GitHub (fijadas por SHA en los flujos): Dependabot propone las versiones nuevas
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Guayaquil"
