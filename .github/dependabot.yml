# Dependabot revisa cada semana si alguna librería tiene una actualización de seguridad
# y abre un pull request con el cambio. Se revisa y se acepta a mano.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Guayaquil"
    open-pull-requests-limit: 5
    groups:
      dependencias-de-desarrollo:
        dependency-type: "development"
        update-types: ["minor", "patch"]
